<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5, user-scalable=yes">
    <title>Dashboard Lazismu PRM Gempolpading</title>
    
    <!-- META -->
    <meta name="description" content="Dashboard Laporan Keuangan Lazismu PRM Gempolpading">
    <meta name="theme-color" content="#1E3A5F">
    <meta name="apple-mobile-web-app-capable" content="yes">
    
    <!-- FAVICON -->
    <link rel="icon" href="logo.png" type="image/png">
    <link rel="apple-touch-icon" href="logo.png">
    
    <!-- FONT AWESOME -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <!-- CHART.JS -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- CONFIG -->
    <script src="config.js"></script>
    
    <style>
        /* ============================================================
           RESET & BASE
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            --primary: #1E3A5F;
            --secondary: #F58220;
            --primary-dark: #152B45;
            --primary-light: #3A5F8A;
            --secondary-dark: #C46A1A;
            --secondary-light: #FAA94C;
            --bg: #F5F7FA;
            --card-bg: #FFFFFF;
            --text: #2C3E50;
            --text-light: #7F8C8D;
            --shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            --shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.15);
            --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.12);
            --radius: 16px;
            --radius-sm: 10px;
            --radius-lg: 24px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: var(--font);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* ============================================================
           SCROLLBAR
           ============================================================ */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary);
        }
        
        /* ============================================================
           LOADING
           ============================================================ */
        #loading {
            position: fixed;
            inset: 0;
            background: var(--bg);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            transition: opacity 0.6s ease;
        }
        #loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
        }
        .loader-ring {
            width: 70px;
            height: 70px;
            border: 5px solid var(--primary-light);
            border-top-color: var(--secondary);
            border-radius: 50%;
            animation: spin 1s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loader-text {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary);
            letter-spacing: 1px;
        }
        .loader-sub {
            font-size: 0.85rem;
            color: var(--text-light);
        }
        .loader-progress {
            width: 200px;
            height: 4px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 5px;
        }
        .loader-progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
            border-radius: 4px;
            animation: progress 1.5s ease-in-out infinite;
        }
        @keyframes progress {
            0% { width: 0%; }
            50% { width: 70%; }
            100% { width: 100%; }
        }
        
        /* ============================================================
           HEADER
           ============================================================ */
        .header {
            background: var(--primary);
            color: white;
            padding: 15px 25px;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
            box-shadow: 0 2px 20px rgba(30, 58, 95, 0.35);
        }
        .header-left {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .header-logo {
            height: 42px;
            width: auto;
            filter: brightness(0) invert(1);
            object-fit: contain;
        }
        .header-title h1 {
            font-size: 1.2rem;
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .header-title small {
            font-size: 0.7rem;
            opacity: 0.85;
            display: block;
            font-weight: 400;
        }
        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header-time {
            font-size: 0.8rem;
            opacity: 0.9;
            background: rgba(255, 255, 255, 0.12);
            padding: 6px 16px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }
        .btn-refresh {
            background: var(--secondary);
            color: white;
            border: none;
            padding: 8px 22px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-refresh:hover {
            transform: scale(1.05);
            box-shadow: 0 5px 20px rgba(245, 130, 32, 0.4);
        }
        .btn-refresh:active {
            transform: scale(0.95);
        }
        .btn-refresh.spinning i {
            animation: spin 0.8s linear infinite;
        }
        .btn-refresh:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        /* ============================================================
           NAVIGATION
           ============================================================ */
        .nav {
            background: white;
            padding: 10px 20px;
            display: flex;
            gap: 6px;
            overflow-x: auto;
            border-bottom: 2px solid #f0f0f0;
            position: sticky;
            top: 72px;
            z-index: 99;
            flex-wrap: nowrap;
            scrollbar-width: thin;
            -webkit-overflow-scrolling: touch;
        }
        .nav::-webkit-scrollbar {
            height: 3px;
        }
        .nav::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }
        .nav-btn {
            padding: 8px 18px;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.85rem;
            transition: var(--transition);
            white-space: nowrap;
            background: #f0f0f0;
            color: #666;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .nav-btn:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(30, 58, 95, 0.25);
        }
        .nav-btn.active {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px rgba(30, 58, 95, 0.3);
        }
        .nav-btn .badge {
            background: var(--secondary);
            color: white;
            font-size: 0.65rem;
            padding: 1px 8px;
            border-radius: 12px;
            font-weight: 700;
        }
        
        /* ============================================================
           MAIN CONTENT
           ============================================================ */
        .container {
            padding: 20px;
            max-width: 1440px;
            margin: 0 auto;
        }
        
        /* ============================================================
           DASHBOARD CARDS
           ============================================================ */
        .cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .card {
            background: var(--card-bg);
            padding: 22px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
            cursor: pointer;
            border-left: 5px solid var(--primary);
            position: relative;
            overflow: hidden;
        }
        .card::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 100px;
            height: 100px;
            background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
            pointer-events: none;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: var(--shadow-hover);
        }
        .card:active {
            transform: scale(0.98);
        }
        .card-icon {
            font-size: 1.8rem;
            margin-bottom: 8px;
            opacity: 0.8;
        }
        .card-icon.primary { color: var(--primary); }
        .card-icon.secondary { color: var(--secondary); }
        .card-icon.success { color: #2ECC71; }
        .card-icon.info { color: #3498DB; }
        .card-icon.danger { color: #E74C3C; }
        .card-icon.warning { color: #F1C40F; }
        
        .card-title {
            font-size: 0.8rem;
            color: var(--text-light);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .card-value {
            font-size: 1.8rem;
            font-weight: 700;
            margin-top: 4px;
            line-height: 1.2;
        }
        .card-value.primary { color: var(--primary); }
        .card-value.secondary { color: var(--secondary); }
        .card-value.success { color: #2ECC71; }
        .card-value.info { color: #3498DB; }
        .card-value.danger { color: #E74C3C; }
        .card-value.warning { color: #F1C40F; }
        
        .card-badge {
            display: inline-block;
            padding: 2px 12px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            margin-top: 8px;
        }
        .card-badge.primary { background: #e3f2fd; color: #1565c0; }
        .card-badge.secondary { background: #fff3e0; color: #e65100; }
        .card-badge.success { background: #e8f5e9; color: #2e7d32; }
        .card-badge.info { background: #e1f5fe; color: #01579b; }
        
        .card-sub {
            font-size: 0.75rem;
            color: var(--text-light);
            margin-top: 4px;
        }
        
        /* ============================================================
           CHARTS
           ============================================================ */
        .charts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
            gap: 25px;
            margin-bottom: 30px;
        }
        .chart-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
        }
        .chart-box:hover {
            box-shadow: var(--shadow-hover);
        }
        .chart-box h3 {
            font-size: 1rem;
            font-weight: 600;
            color: var(--text);
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .chart-container {
            position: relative;
            height: 260px;
        }
        .chart-container-sm {
            height: 200px;
        }
        
        /* ============================================================
           DONATUR BOX
           ============================================================ */
        .donatur-box {
            background: var(--card-bg);
            padding: 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 30px;
            transition: var(--transition);
        }
        .donatur-box:hover {
            box-shadow: var(--shadow-hover);
        }
        .donatur-box h3 {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .donatur-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #f0f0f0;
            transition: var(--transition);
            border-radius: 6px;
        }
        .donatur-item:hover {
            background: #f8f9fa;
        }
        .donatur-item:last-child {
            border-bottom: none;
        }
        .donatur-name {
            font-weight: 600;
            font-size: 0.9rem;
        }
        .donatur-info {
            font-size: 0.8rem;
            color: var(--text-light);
        }
        .donatur-status {
            padding: 3px 14px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
        }
        .status-belum {
            background: #ffebee;
            color: #c62828;
        }
        .status-sudah {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .status-proses {
            background: #fff3e0;
            color: #e65100;
        }
        
        /* ============================================================
           TABLE
           ============================================================ */
        .table-container {
            background: var(--card-bg);
            border-radius: var(--radius);
            padding: 20px;
            box-shadow: var(--shadow);
            overflow-x: auto;
            margin-bottom: 30px;
            transition: var(--transition);
        }
        .table-container:hover {
            box-shadow: var(--shadow-hover);
        }
        .table-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 15px;
        }
        .table-header h2 {
            font-size: 1.05rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .table-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }
        .table-search {
            padding: 8px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 0.85rem;
            min-width: 200px;
            transition: var(--transition);
            background: white;
        }
        .table-search:focus {
            border-color: var(--primary);
            outline: none;
            box-shadow: 0 0 0 4px rgba(30, 58, 95, 0.1);
        }
        .table-search::placeholder {
            color: #bbb;
        }
        
        .table-info {
            font-size: 0.85rem;
            color: var(--text-light);
        }
        
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.9rem;
        }
        thead th {
            background: var(--primary);
            color: white;
            padding: 12px 16px;
            text-align: left;
            font-weight: 600;
            position: sticky;
            top: 0;
            white-space: nowrap;
        }
        thead th:first-child {
            border-radius: 8px 0 0 0;
        }
        thead th:last-child {
            border-radius: 0 8px 0 0;
        }
        tbody td {
            padding: 10px 16px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }
        tbody tr:hover td {
            background: #f8f9fa;
        }
        tbody tr:last-child td {
            border-bottom: none;
        }
        .table-striped tbody tr:nth-child(even) td {
            background: #fafafa;
        }
        .table-striped tbody tr:nth-child(even):hover td {
            background: #f5f6f7;
        }
        
        /* ============================================================
           PAGINATION
           ============================================================ */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 5px;
            margin-top: 18px;
            flex-wrap: wrap;
            align-items: center;
        }
        .pagination-info {
            margin-right: 15px;
            font-size: 0.85rem;
            color: var(--text-light);
        }
        .page-btn {
            padding: 6px 14px;
            border: 1px solid #ddd;
            border-radius: 6px;
            cursor: pointer;
            background: white;
            transition: var(--transition);
            font-size: 0.85rem;
            font-weight: 500;
            min-width: 36px;
            text-align: center;
        }
        .page-btn:hover {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .page-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .page-btn:disabled:hover {
            background: white;
            color: inherit;
        }
        
        /* ============================================================
           EMPTY STATE
           ============================================================ */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: var(--text-light);
        }
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 15px;
            opacity: 0.3;
        }
        .empty-state h3 {
            font-size: 1.1rem;
            margin-bottom: 8px;
            color: var(--text);
        }
        .empty-state p {
            font-size: 0.9rem;
        }
        
        /* ============================================================
           TOAST NOTIFICATION
           ============================================================ */
        .toast-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
            max-width: 400px;
            width: 100%;
        }
        .toast {
            padding: 14px 20px;
            border-radius: 12px;
            color: white;
            box-shadow: var(--shadow-lg);
            animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 500;
            font-size: 0.9rem;
            transform-origin: bottom;
            backdrop-filter: blur(10px);
        }
        .toast-success {
            background: linear-gradient(135deg, #2ECC71, #27AE60);
        }
        .toast-error {
            background: linear-gradient(135deg, #E74C3C, #C0392B);
        }
        .toast-info {
            background: linear-gradient(135deg, #3498DB, #2980B9);
        }
        .toast-warning {
            background: linear-gradient(135deg, #F1C40F, #F39C12);
        }
        .toast-icon {
            font-size: 1.3rem;
        }
        .toast-close {
            margin-left: auto;
            background: none;
            border: none;
            color: white;
            cursor: pointer;
            font-size: 1.2rem;
            opacity: 0.7;
            transition: var(--transition);
        }
        .toast-close:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(50px) scale(0.95);
                opacity: 0;
            }
            to {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
        }
        @keyframes slideDown {
            from {
                transform: translateY(0) scale(1);
                opacity: 1;
            }
            to {
                transform: translateY(50px) scale(0.95);
                opacity: 0;
            }
        }
        .toast.hiding {
            animation: slideDown 0.3s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }
        
        /* ============================================================
           RESPONSIVE
           ============================================================ */
        @media (max-width: 992px) {
            .cards {
                grid-template-columns: repeat(2, 1fr);
            }
            .charts {
                grid-template-columns: 1fr;
            }
        }
        
        @media (max-width: 768px) {
            .header {
                padding: 12px 16px;
            }
            .header-title h1 {
                font-size: 1rem;
            }
            .header-logo {
                height: 32px;
            }
            .header-time {
                font-size: 0.7rem;
                padding: 4px 12px;
            }
            .btn-refresh {
                padding: 6px 16px;
                font-size: 0.75rem;
            }
            .nav {
                padding: 8px 12px;
                top: 60px;
                gap: 4px;
            }
            .nav-btn {
                padding: 6px 14px;
                font-size: 0.75rem;
            }
            .container {
                padding: 12px;
            }
            .cards {
                grid-template-columns: 1fr 1fr;
                gap: 12px;
            }
            .card {
                padding: 16px;
            }
            .card-value {
                font-size: 1.3rem;
            }
            .card-icon {
                font-size: 1.4rem;
            }
            .chart-container {
                height: 200px;
            }
            .charts {
                gap: 15px;
            }
            .table-container {
                padding: 12px;
            }
            .table-header {
                flex-direction: column;
                align-items: stretch;
            }
            .table-search {
                min-width: unset;
                width: 100%;
            }
            .table-controls {
                flex-direction: column;
            }
            .pagination {
                gap: 3px;
            }
            .page-btn {
                padding: 4px 10px;
                font-size: 0.75rem;
                min-width: 30px;
            }
            .pagination-info {
                margin-right: 0;
                margin-bottom: 5px;
                width: 100%;
                text-align: center;
            }
            .donatur-item {
                flex-wrap: wrap;
                gap: 5px;
            }
            .donatur-status {
                font-size: 0.65rem;
                padding: 2px 10px;
            }
            .header-right {
                width: 100%;
                justify-content: center;
            }
        }
        
        @media (max-width: 480px) {
            .cards {
                grid-template-columns: 1fr;
            }
            .header-left {
                flex-direction: column;
                align-items: center;
                text-align: center;
            }
            .header-title h1 {
                font-size: 0.9rem;
            }
            .header-title small {
                font-size: 0.65rem;
            }
            .chart-container {
                height: 170px;
            }
            .chart-box {
                padding: 12px;
            }
            .card-value {
                font-size: 1.1rem;
            }
            thead th,
            tbody td {
                padding: 8px 10px;
                font-size: 0.75rem;
            }
            .table-container {
                padding: 8px;
                border-radius: 10px;
            }
            .nav-btn {
                font-size: 0.7rem;
                padding: 5px 12px;
            }
            .container {
                padding: 8px;
            }
            .donatur-item {
                font-size: 0.85rem;
            }
        }
        
        @media (max-width: 360px) {
            .header-title h1 {
                font-size: 0.75rem;
            }
            .header-logo {
                height: 28px;
            }
            .btn-refresh {
                padding: 4px 12px;
                font-size: 0.65rem;
            }
            .header-time {
                font-size: 0.6rem;
                padding: 3px 10px;
            }
        }
        
        /* ============================================================
           PRINT STYLES
           ============================================================ */
        @media print {
            .header,
            .nav,
            .btn-refresh,
            .pagination,
            .toast-container,
            .table-search {
                display: none !important;
            }
            .container {
                padding: 0 !important;
                max-width: 100% !important;
            }
            .card {
                break-inside: avoid;
                box-shadow: none !important;
                border: 1px solid #ddd !important;
            }
            .chart-box {
                break-inside: avoid;
                box-shadow: none !important;
                border: 1px solid #ddd !important;
            }
            .table-container {
                box-shadow: none !important;
                border: 1px solid #ddd !important;
            }
            body {
                background: white !important;
            }
            .card:hover {
                transform: none !important;
            }
        }
    </style>
</head>
<body>

<!-- ============================================================
LOADING
============================================================ -->
<div id="loading">
    <div class="loader-wrapper">
        <div class="loader-ring"></div>
        <div class="loader-text">⏳ Memuat Data Real...</div>
        <div class="loader-sub">Mengambil data dari spreadsheet</div>
        <div class="loader-progress">
            <div class="loader-progress-bar"></div>
        </div>
    </div>
</div>

<!-- ============================================================
TOAST CONTAINER
============================================================ -->
<div class="toast-container" id="toastContainer"></div>

<!-- ============================================================
HEADER
============================================================ -->
<header class="header">
    <div class="header-left">
        <img src="logo.png" alt="Logo Lazismu" class="header-logo" 
             onerror="this.style.display='none'">
        <div class="header-title">
            <h1>LAZISMU PRM GEMPOLPADING</h1>
            <small>Dashboard Laporan Keuangan • Real Data</small>
        </div>
    </div>
    <div class="header-right">
        <span class="header-time" id="lastUpdate">
            <i class="fas fa-clock"></i> Memuat...
        </span>
        <button class="btn-refresh" id="btnRefresh" onclick="refreshData()">
            <i class="fas fa-sync-alt"></i> Refresh
        </button>
    </div>
</header>

<!-- ============================================================
NAVIGATION
============================================================ -->
<nav class="nav" id="navContainer">
    <button class="nav-btn active" data-sheet="dashboard" onclick="switchSheet('dashboard')">
        <i class="fas fa-th-large"></i> Dashboard
    </button>
    <button class="nav-btn" data-sheet="donatur" onclick="switchSheet('donatur')">
        <i class="fas fa-users"></i> Donatur
        <span class="badge" id="donaturBadge">0</span>
    </button>
    <!-- Sheet buttons akan ditambahkan otomatis oleh JavaScript -->
</nav>

<!-- ============================================================
MAIN CONTENT
============================================================ -->
<div class="container" id="mainContent">
    <!-- Content akan di-render oleh JavaScript -->
</div>

<!-- ============================================================
JAVASCRIPT - MAIN APPLICATION
============================================================ -->
<script>
// ============================================================
// 1. STATE & VARIABLES
// ============================================================

let allData = null;
let currentSheet = 'dashboard';
let currentPage = 1;
let currentSearch = '';
let charts = {};
let refreshInterval = null;
let isRefreshing = false;
let donaturData = [];

// ============================================================
// 2. DOM REFS
// ============================================================

const loadingEl = document.getElementById('loading');
const mainContent = document.getElementById('mainContent');
const navContainer = document.getElementById('navContainer');
const lastUpdateEl = document.getElementById('lastUpdate');
const btnRefresh = document.getElementById('btnRefresh');
const toastContainer = document.getElementById('toastContainer');

// ============================================================
// 3. TOAST SYSTEM
// ============================================================

function showToast(message, type = 'info', duration = 4000) {
    const icons = {
        success: '✅',
        error: '❌',
        warning: '⚠️',
        info: 'ℹ️'
    };
    
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.innerHTML = `
        <span class="toast-icon">${icons[type] || 'ℹ️'}</span>
        <span>${message}</span>
        <button class="toast-close" onclick="this.parentElement.remove()">×</button>
    `;
    
    toastContainer.appendChild(toast);
    
    setTimeout(() => {
        toast.classList.add('hiding');
        setTimeout(() => toast.remove(), 300);
    }, duration);
}

// ============================================================
// 4. LOADING SYSTEM
// ============================================================

function showLoading(show) {
    if (show) {
        loadingEl.classList.remove('hidden');
    } else {
        loadingEl.classList.add('hidden');
    }
}

// ============================================================
// 5. LOAD DATA - MENGGUNAKAN google.script.run
// ============================================================

function loadData() {
    showLoading(true);
    
    // Panggil fungsi di Apps Script via google.script.run
    google.script.run
        .withSuccessHandler(function(result) {
            if (result.success) {
                allData = result;
                renderNavigation();
                renderCurrentView();
                updateLastUpdate(result.lastUpdate);
                updateDonaturBadge();
                showToast('✅ Data berhasil dimuat', 'success');
            } else {
                showToast('❌ Gagal memuat data: ' + (result.error || 'Unknown error'), 'error');
                mainContent.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-exclamation-triangle"></i>
                        <h3>Gagal Memuat Data</h3>
                        <p>${result.error || 'Terjadi kesalahan saat mengambil data dari spreadsheet'}</p>
                        <button class="btn-refresh" style="margin-top:15px;display:inline-flex;" onclick="refreshData()">
                            <i class="fas fa-sync-alt"></i> Coba Lagi
                        </button>
                    </div>
                `;
            }
            showLoading(false);
        })
        .withFailureHandler(function(error) {
            showToast('❌ Error: ' + error.message, 'error');
            mainContent.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-plug"></i>
                    <h3>Koneksi Gagal</h3>
                    <p>${error.message || 'Tidak dapat terhubung ke server'}</p>
                    <button class="btn-refresh" style="margin-top:15px;display:inline-flex;" onclick="refreshData()">
                        <i class="fas fa-sync-alt"></i> Coba Lagi
                    </button>
                </div>
            `;
            showLoading(false);
        })
        .getAllData(); // Nama fungsi di appscript.gs
}

// ============================================================
// 6. REFRESH DATA
// ============================================================

function refreshData() {
    if (isRefreshing) return;
    isRefreshing = true;
    btnRefresh.classList.add('spinning');
    btnRefresh.disabled = true;
    
    google.script.run
        .withSuccessHandler(function(result) {
            if (result.success) {
                allData = result.data || result;
                renderNavigation();
                renderCurrentView();
                updateLastUpdate(allData.lastUpdate);
                updateDonaturBadge();
                showToast('✅ Data berhasil di-refresh', 'success');
            } else {
                showToast('❌ Refresh gagal: ' + (result.error || 'Unknown error'), 'error');
            }
            isRefreshing = false;
            btnRefresh.classList.remove('spinning');
            btnRefresh.disabled = false;
        })
        .withFailureHandler(function(error) {
            showToast('❌ Refresh error: ' + error.message, 'error');
            isRefreshing = false;
            btnRefresh.classList.remove('spinning');
            btnRefresh.disabled = false;
        })
        .refreshCache(); // Nama fungsi di appscript.gs
}

// ============================================================
// 7. NAVIGATION
// ============================================================

function renderNavigation() {
    // Hapus sheet buttons (simpan dashboard & donatur)
    const existingSheets = navContainer.querySelectorAll('.nav-btn:not([data-sheet="dashboard"]):not([data-sheet="donatur"])');
    existingSheets.forEach(el => el.remove());
    
    if (!allData || !allData.sheets) return;
    
    // Sortir sheet berdasarkan nama
    const sortedSheets = [...allData.sheets].sort((a, b) => a.name.localeCompare(b.name));
    
    sortedSheets.forEach(sheet => {
        const btn = document.createElement('button');
        btn.className = 'nav-btn';
        btn.dataset.sheet = sheet.name;
        btn.innerHTML = `
            <i class="fas fa-file-alt"></i>
            ${sheet.name}
            <span class="badge">${sheet.total || 0}</span>
        `;
        btn.onclick = () => switchSheet(sheet.name);
        navContainer.appendChild(btn);
    });
}

function switchSheet(sheetName) {
    currentSheet = sheetName;
    currentPage = 1;
    currentSearch = '';
    
    // Update active nav
    navContainer.querySelectorAll('.nav-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.sheet === sheetName);
    });
    
    renderCurrentView();
    
    // Scroll to top
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderCurrentView() {
    if (!allData) {
        mainContent.innerHTML = '<div class="empty-state"><h3>⚠️ Belum ada data</h3></div>';
        return;
    }
    
    if (currentSheet === 'dashboard') {
        renderDashboard();
    } else if (currentSheet === 'donatur') {
        renderDonatur();
    } else {
        renderSheet(currentSheet);
    }
}

function updateLastUpdate(date) {
    if (!date) return;
    try {
        const d = new Date(date);
        const formatted = d.toLocaleString('id-ID', {
            day: '2-digit',
            month: 'long',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
        lastUpdateEl.innerHTML = `<i class="fas fa-clock"></i> ${formatted}`;
    } catch (e) {
        lastUpdateEl.textContent = '🕐 ' + date;
    }
}

function updateDonaturBadge() {
    const badge = document.getElementById('donaturBadge');
    if (badge && allData && allData.summary) {
        badge.textContent = allData.summary.totalDonatur || 0;
    }
}

// ============================================================
// 8. RENDER DASHBOARD
// ============================================================

function renderDashboard() {
    if (!allData || !allData.summary) {
        mainContent.innerHTML = '<div class="empty-state"><h3>⚠️ Tidak ada data dashboard</h3></div>';
        return;
    }
    
    const s = allData.summary;
    const totalSheets = allData.totalSheets || 0;
    
    let html = `
        <!-- Cards -->
        <div class="cards">
            <div class="card" style="border-left-color: var(--primary)">
                <div class="card-icon primary"><i class="fas fa-arrow-down"></i></div>
                <div class="card-title">TOTAL KAS MASUK</div>
                <div class="card-value primary">${formatRupiah(s.totalKasMasuk)}</div>
                <div class="card-sub">Dari ${totalSheets} sheet</div>
            </div>
            <div class="card" style="border-left-color: var(--secondary)">
                <div class="card-icon secondary"><i class="fas fa-arrow-up"></i></div>
                <div class="card-title">TOTAL KAS KELUAR</div>
                <div class="card-value secondary">${formatRupiah(s.totalKasKeluar)}</div>
                <div class="card-sub">Dari ${totalSheets} sheet</div>
            </div>
            <div class="card" style="border-left-color: #2ECC71">
                <div class="card-icon success"><i class="fas fa-wallet"></i></div>
                <div class="card-title">TOTAL SALDO AKHIR</div>
                <div class="card-value success">${formatRupiah(s.totalSaldo)}</div>
                <div class="card-sub">Selisih Masuk - Keluar</div>
            </div>
            <div class="card" style="border-left-color: #3498DB">
                <div class="card-icon info"><i class="fas fa-users"></i></div>
                <div class="card-title">TOTAL DONATUR</div>
                <div class="card-value info">${s.totalDonatur || 0}</div>
                <div class="card-sub">Donatur unik terdaftar</div>
                <span class="card-badge primary">${totalSheets} Sheet Aktif</span>
            </div>
        </div>
        
        <!-- Charts -->
        <div class="charts">
            <div class="chart-box">
                <h3><i class="fas fa-chart-bar" style="color:var(--primary)"></i> Perbandingan per Sheet</h3>
                <div class="chart-container">
                    <canvas id="chartBar"></canvas>
                </div>
            </div>
            <div class="chart-box">
                <h3><i class="fas fa-chart-pie" style="color:var(--secondary)"></i> Distribusi Saldo</h3>
                <div class="chart-container">
                    <canvas id="chartPie"></canvas>
                </div>
            </div>
        </div>
        
        <!-- Donatur Reminder -->
        <div class="donatur-box">
            <h3><i class="fas fa-bell" style="color:var(--secondary)"></i> 🔔 Reminder Donatur</h3>
            <div id="donaturReminder">
                <div style="text-align:center;padding:20px;color:var(--text-light);">
                    <i class="fas fa-spinner fa-spin"></i> Memuat data donatur...
                </div>
            </div>
        </div>
        
        <!-- Summary Table -->
        <div class="table-container">
            <div class="table-header">
                <h2><i class="fas fa-table" style="color:var(--primary)"></i> Ringkasan per Sheet</h2>
                <span class="table-info">Total: ${allData.sheets.length} Sheet • ${s.totalRows || 0} Data</span>
            </div>
            <table class="table-striped">
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Nama Sheet</th>
                        <th>Total Data</th>
                        <th>Kas Masuk</th>
                        <th>Kas Keluar</th>
                        <th>Saldo</th>
                        <th>Donatur</th>
                    </tr>
                </thead>
                <tbody>
                    ${allData.sheets.map((sheet, i) => `
                        <tr onclick="switchSheet('${sheet.name}')" style="cursor:pointer;">
                            <td>${i+1}</td>
                            <td><strong>${sheet.name}</strong></td>
                            <td>${sheet.total || 0}</td>
                            <td>${formatRupiah(sheet.summary.totalKasMasuk)}</td>
                            <td>${formatRupiah(sheet.summary.totalKasKeluar)}</td>
                            <td>${formatRupiah(sheet.summary.totalSaldo)}</td>
                            <td>${sheet.summary.totalDonatur || 0}</td>
                        </tr>
                    `).join('')}
                </tbody>
            </table>
        </div>
    `;
    
    mainContent.innerHTML = html;
    
    // Render charts setelah DOM siap
    setTimeout(() => {
        renderCharts();
        loadDonaturReminder();
    }, 100);
}

// ============================================================
// 9. RENDER CHARTS
// ============================================================

function renderCharts() {
    // Destroy existing charts
    Object.values(charts).forEach(c => {
        if (c) { try { c.destroy(); } catch(e) {} }
    });
    charts = {};
    
    if (!allData || !allData.sheets || allData.sheets.length === 0) return;
    
    const sheetNames = allData.sheets.map(s => s.name);
    const kasMasuk = allData.sheets.map(s => s.summary.totalKasMasuk || 0);
    const kasKeluar = allData.sheets.map(s => s.summary.totalKasKeluar || 0);
    const saldo = allData.sheets.map(s => s.summary.totalSaldo || 0);
    const colors = CONFIG.COLORS.chartColors || ['#1E3A5F', '#F58220', '#2ECC71', '#E74C3C', '#3498DB'];
    
    // Bar Chart
    const ctxBar = document.getElementById('chartBar');
    if (ctxBar) {
        charts.bar = new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: sheetNames,
                datasets: [
                    {
                        label: 'Kas Masuk',
                        data: kasMasuk,
                        backgroundColor: '#1E3A5F',
                        borderRadius: 4
                    },
                    {
                        label: 'Kas Keluar',
                        data: kasKeluar,
                        backgroundColor: '#F58220',
                        borderRadius: 4
                    },
                    {
                        label: 'Saldo',
                        data: saldo,
                        backgroundColor: '#2ECC71',
                        borderRadius: 4
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: { size: 11 },
                            padding: 15,
                            usePointStyle: true,
                            pointStyle: 'circle'
                        }
                    }
                },
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            callback: function(value) {
                                return 'Rp ' + (value / 1000).toFixed(0) + 'K';
                            }
                        }
                    }
                }
            }
        });
    }
    
    // Pie Chart
    const ctxPie = document.getElementById('chartPie');
    if (ctxPie) {
        const totalSaldo = allData.sheets.map(s => Math.max(s.summary.totalSaldo || 0, 0.1));
        const pieColors = colors.slice(0, sheetNames.length);
        
        charts.pie = new Chart(ctxPie, {
            type: 'doughnut',
            data: {
                labels: sheetNames,
                datasets: [{
                    data: totalSaldo,
                    backgroundColor: pieColors,
                    borderWidth: 2,
                    borderColor: '#ffffff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            font: { size: 11 },
                            padding: 15,
                            usePointStyle: true,
                            pointStyle: 'circle'
                        }
                    }
                },
                cutout: '60%'
            }
        });
    }
}

// ============================================================
// 10. LOAD DONATUR REMINDER - via google.script.run
// ============================================================

function loadDonaturReminder() {
    const container = document.getElementById('donaturReminder');
    if (!container) return;
    
    google.script.run
        .withSuccessHandler(function(result) {
            if (result.success && result.donators && result.donators.length > 0) {
                donaturData = result.donators;
                
                // Tampilkan 5 donatur teratas yang belum donasi
                const belumDonasi = result.donators
                    .filter(d => d.totalDonasi === 0)
                    .slice(0, 5);
                
                const topDonatur = result.donators.slice(0, 5);
                
                if (belumDonasi.length > 0) {
                    container.innerHTML = `
                        <div style="margin-bottom:12px;font-weight:600;color:var(--secondary);">
                            ⚠️ ${belumDonasi.length} donatur belum berdonasi:
                        </div>
                        ${belumDonasi.map(d => `
                            <div class="donatur-item">
                                <span class="donatur-name">${d.name}</span>
                                <span class="donatur-info">${d.id ? 'ID: ' + d.id : ''}</span>
                                <span class="donatur-status status-belum">⏳ Belum Donasi</span>
                            </div>
                        `).join('')}
                        <div style="margin-top:12px;font-size:0.8rem;color:var(--text-light);">
                            🏆 Top Donatur: ${topDonatur.map(d => d.name).join(', ')}
                        </div>
                    `;
                } else {
                    container.innerHTML = `
                        <div style="padding:10px 0;color:#2ECC71;font-weight:600;">
                            ✅ Semua donatur sudah berdonasi!
                        </div>
                        <div style="margin-top:10px;font-size:0.85rem;color:var(--text-light);">
                            🏆 Top Donatur: ${topDonatur.map(d => d.name).join(', ')}
                        </div>
                    `;
                }
            } else {
                container.innerHTML = `
                    <div style="text-align:center;padding:20px;color:var(--text-light);">
                        <i class="fas fa-users" style="font-size:2rem;opacity:0.3;display:block;margin-bottom:10px;"></i>
                        Belum ada data donatur
                    </div>
                `;
            }
        })
        .withFailureHandler(function(error) {
            container.innerHTML = `
                <div style="text-align:center;padding:20px;color:#E74C3C;">
                    ❌ Gagal memuat data donatur: ${error.message}
                </div>
            `;
        })
        .getDonators(); // Nama fungsi di appscript.gs
}

// ============================================================
// 11. RENDER SHEET - via google.script.run
// ============================================================

function renderSheet(sheetName) {
    // Tampilkan loading
    mainContent.innerHTML = `
        <div style="text-align:center;padding:40px;">
            <i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--primary);"></i>
            <p style="margin-top:15px;color:var(--text-light);">Memuat data sheet...</p>
        </div>
    `;
    
    google.script.run
        .withSuccessHandler(function(result) {
            if (result.success) {
                renderSheetData(result.data, sheetName);
            } else {
                mainContent.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-file-alt"></i>
                        <h3>Sheet "${sheetName}" tidak ditemukan</h3>
                        <p>${result.error || 'Sheet mungkin telah dihapus atau diubah namanya'}</p>
                    </div>
                `;
            }
        })
        .withFailureHandler(function(error) {
            mainContent.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle" style="color:#E74C3C;"></i>
                    <h3>Gagal Memuat Sheet</h3>
                    <p>${error.message}</p>
                </div>
            `;
        })
        .getSheetData(sheetName); // Nama fungsi di appscript.gs
}

function renderSheetData(sheet, sheetName) {
    const rows = sheet.rows || [];
    const headers = sheet.headers || [];
    const summary = sheet.summary || {};
    
    // Filter dengan search
    let filteredRows = rows;
    if (currentSearch && currentSearch.trim()) {
        const searchLower = currentSearch.toLowerCase().trim();
        filteredRows = rows.filter(row => {
            return row.searchText && row.searchText.includes(searchLower);
        });
    }
    
    // Pagination
    const itemsPerPage = CONFIG.PAGINATION.itemsPerPage || 20;
    const totalPages = Math.ceil(filteredRows.length / itemsPerPage);
    const safePage = Math.min(Math.max(currentPage, 1), totalPages || 1);
    currentPage = safePage;
    const start = (currentPage - 1) * itemsPerPage;
    const end = Math.min(start + itemsPerPage, filteredRows.length);
    const pageRows = filteredRows.slice(start, end);
    
    let html = `
        <div class="table-container">
            <div class="table-header">
                <h2><i class="fas fa-file-alt" style="color:var(--primary)"></i> ${sheetName}</h2>
                <div class="table-controls">
                    <span class="table-info">
                        ${filteredRows.length} data
                        ${filteredRows.length !== rows.length ? `(dari ${rows.length} total)` : ''}
                    </span>
                    <input class="table-search" placeholder="🔍 Cari data..." 
                           value="${currentSearch}" 
                           oninput="searchInSheet('${sheetName}', this.value)">
                </div>
            </div>
            
            ${summary.totalKasMasuk > 0 || summary.totalSaldo > 0 ? `
            <div style="display:flex;gap:20px;flex-wrap:wrap;padding:10px 0 15px 0;border-bottom:2px solid #f0f0f0;margin-bottom:15px;">
                <div><strong>Kas Masuk:</strong> ${formatRupiah(summary.totalKasMasuk)}</div>
                <div><strong>Kas Keluar:</strong> ${formatRupiah(summary.totalKasKeluar)}</div>
                <div><strong>Saldo:</strong> ${formatRupiah(summary.totalSaldo)}</div>
                <div><strong>Donatur:</strong> ${summary.totalDonatur || 0}</div>
                <div><strong>Total Data:</strong> ${summary.totalRows || rows.length}</div>
            </div>
            ` : ''}
            
            ${pageRows.length > 0 ? `
            <div style="overflow-x:auto;">
                <table class="table-striped">
                    <thead>
                        <tr>
                            ${headers.map(h => `<th>${h || 'Kolom'}</th>`).join('')}
                        </tr>
                    </thead>
                    <tbody>
                        ${pageRows.map(row => `
                            <tr>
                                ${headers.map((h, i) => {
                                    const val = row.allData ? row.allData[`col_${i}`] : '-';
                                    // Format jika angka
                                    if (typeof val === 'number' && !isNaN(val)) {
                                        return `<td>${formatRupiah(val)}</td>`;
                                    }
                                    // Format jika tanggal
                                    if (h && (h.toLowerCase().includes('tanggal') || h.toLowerCase().includes('tgl'))) {
                                        return `<td>${formatDate(val)}</td>`;
                                    }
                                    return `<td>${val !== undefined && val !== null && val !== '' ? val : '-'}</td>`;
                                }).join('')}
                            </tr>
                        `).join('')}
                    </tbody>
                </table>
            </div>
            
            ${totalPages > 1 ? `
            <div class="pagination">
                <span class="pagination-info">
                    Menampilkan ${start + 1}-${end} dari ${filteredRows.length} data
                </span>
                <button class="page-btn" onclick="changePage('${sheetName}', ${currentPage - 1})" ${currentPage <= 1 ? 'disabled' : ''}>
                    <i class="fas fa-chevron-left"></i>
                </button>
                ${Array.from({length: Math.min(totalPages, 7)}, (_, i) => {
                    let pageNum;
                    if (totalPages <= 7) {
                        pageNum = i + 1;
                    } else if (currentPage <= 4) {
                        pageNum = i + 1;
                    } else if (currentPage >= totalPages - 3) {
                        pageNum = totalPages - 6 + i;
                    } else {
                        pageNum = currentPage - 3 + i;
                    }
                    if (pageNum < 1 || pageNum > totalPages) return '';
                    return `<button class="page-btn ${pageNum === currentPage ? 'active' : ''}" onclick="changePage('${sheetName}', ${pageNum})">${pageNum}</button>`;
                }).join('')}
                <button class="page-btn" onclick="changePage('${sheetName}', ${currentPage + 1})" ${currentPage >= totalPages ? 'disabled' : ''}>
                    <i class="fas fa-chevron-right"></i>
                </button>
            </div>
            ` : ''}
            ` : `
            <div class="empty-state" style="padding:30px;">
                <i class="fas fa-inbox"></i>
                <h3>Tidak ada data</h3>
                <p>${currentSearch ? 'Tidak ditemukan data yang cocok dengan pencarian' : 'Sheet ini kosong'}</p>
            </div>
            `}
        </div>
    `;
    
    mainContent.innerHTML = html;
}

// ============================================================
// 12. RENDER DONATUR - via google.script.run
// ============================================================

function renderDonatur() {
    mainContent.innerHTML = `
        <div class="donatur-box">
            <h3><i class="fas fa-users" style="color:var(--primary)"></i> 👥 Daftar Donatur</h3>
            <div style="text-align:center;padding:30px;">
                <i class="fas fa-spinner fa-spin" style="font-size:2rem;color:var(--primary);"></i>
                <p style="margin-top:15px;color:var(--text-light);">Memuat data donatur...</p>
            </div>
        </div>
    `;
    
    google.script.run
        .withSuccessHandler(function(result) {
            if (result.success && result.donators) {
                const donators = result.donators;
                const totalDonasi = result.totalDonasiFormatted || formatRupiah(0);
                
                let html = `
                    <div class="donatur-box">
                        <h3><i class="fas fa-users" style="color:var(--primary)"></i> 👥 Daftar Donatur (${donators.length})</h3>
                        <div style="display:flex;gap:20px;flex-wrap:wrap;padding:10px 0 15px 0;border-bottom:2px solid #f0f0f0;margin-bottom:15px;">
                            <div><strong>Total Donatur:</strong> ${donators.length}</div>
                            <div><strong>Total Donasi:</strong> ${totalDonasi}</div>
                        </div>
                        <div style="margin-bottom:15px;">
                            <input class="table-search" placeholder="🔍 Cari donatur..." 
                                   oninput="filterDonatur(this.value)" style="width:100%;">
                        </div>
                        <div id="donaturList">
                            ${donators.map(d => `
                                <div class="donatur-item" data-name="${d.name.toLowerCase()}">
                                    <span class="donatur-name">${d.name}</span>
                                    <span class="donatur-info">${d.id ? 'ID: ' + d.id : ''}</span>
                                    <span class="donatur-info">${d.sheets ? d.sheets.join(', ') : ''}</span>
                                    <span>${formatRupiah(d.totalDonasi)}</span>
                                    <span class="donatur-status ${d.totalDonasi > 0 ? 'status-sudah' : 'status-belum'}">
                                        ${d.totalDonasi > 0 ? '✅ Donasi' : '⏳ Belum'}
                                    </span>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
                
                mainContent.innerHTML = html;
            } else {
                mainContent.innerHTML = `
                    <div class="empty-state">
                        <i class="fas fa-users"></i>
                        <h3>Belum ada data donatur</h3>
                        <p>Data donatur akan muncul setelah ada data di spreadsheet</p>
                    </div>
                `;
            }
        })
        .withFailureHandler(function(error) {
            mainContent.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-exclamation-triangle" style="color:#E74C3C;"></i>
                    <h3>Gagal Memuat Donatur</h3>
                    <p>${error.message}</p>
                </div>
            `;
        })
        .getDonators(); // Nama fungsi di appscript.gs
}

// ============================================================
// 13. HELPER FUNCTIONS
// ============================================================

function formatRupiah(amount) {
    if (amount === undefined || amount === null || isNaN(amount)) {
        return 'Rp 0';
    }
    return 'Rp ' + Math.round(amount).toLocaleString('id-ID');
}

function formatDate(value) {
    if (!value) return '-';
    try {
        const d = new Date(value);
        if (isNaN(d.getTime())) return String(value);
        return d.toLocaleDateString('id-ID', {
            day: '2-digit',
            month: 'long',
            year: 'numeric'
        });
    } catch(e) {
        return String(value);
    }
}

function changePage(sheetName, page) {
    if (page < 1) return;
    currentPage = page;
    renderSheet(sheetName);
}

function searchInSheet(sheetName, query) {
    currentSearch = query;
    currentPage = 1;
    renderSheet(sheetName);
}

function filterDonatur(query) {
    const items = document.querySelectorAll('#donaturList .donatur-item');
    const q = query.toLowerCase().trim();
    items.forEach(item => {
        const name = item.dataset.name || item.textContent.toLowerCase();
        item.style.display = name.includes(q) ? 'flex' : 'none';
    });
}

// ============================================================
// 14. AUTO REFRESH
// ============================================================

function startAutoRefresh() {
    if (refreshInterval) {
        clearInterval(refreshInterval);
    }
    
    if (CONFIG.AUTO_REFRESH && CONFIG.AUTO_REFRESH.enabled) {
        const interval = CONFIG.AUTO_REFRESH.interval || 300000;
        refreshInterval = setInterval(() => {
            // Refresh in background
            refreshData();
        }, interval);
    }
}

// Refresh saat tab aktif kembali
document.addEventListener('visibilitychange', function() {
    if (CONFIG.AUTO_REFRESH && CONFIG.AUTO_REFRESH.onFocus && !document.hidden) {
        refreshData();
    }
});

// Refresh saat koneksi kembali
window.addEventListener('online', function() {
    if (CONFIG.AUTO_REFRESH && CONFIG.AUTO_REFRESH.onReconnect) {
        refreshData();
    }
});

// ============================================================
// 15. KEYBOARD SHORTCUTS
// ============================================================

document.addEventListener('keydown', function(e) {
    // Ctrl+R atau Cmd+R untuk refresh
    if ((e.ctrlKey || e.metaKey) && e.key === 'r') {
        e.preventDefault();
        refreshData();
    }
    // Escape untuk close toast
    if (e.key === 'Escape') {
        document.querySelectorAll('.toast').forEach(t => t.remove());
    }
});

// ============================================================
// 16. INIT
// ============================================================

document.addEventListener('DOMContentLoaded', function() {
    // Load data
    loadData();
    
    // Start auto refresh
    startAutoRefresh();
    
    console.log('✅ Dashboard Lazismu PRM Gempolpading siap!');
    console.log('📊 Repository:', CONFIG.GITHUB_REPO);
    console.log('🔄 Auto refresh:', CONFIG.AUTO_REFRESH.enabled ? 'ON (' + (CONFIG.AUTO_REFRESH.interval / 1000) + 's)' : 'OFF');
});

// ============================================================
// 17. EXPOSE FUNCTIONS TO GLOBAL
// ============================================================

window.loadData = loadData;
window.refreshData = refreshData;
window.switchSheet = switchSheet;
window.changePage = changePage;
window.searchInSheet = searchInSheet;
window.filterDonatur = filterDonatur;
window.formatRupiah = formatRupiah;
window.formatDate = formatDate;
window.showToast = showToast;

console.log('✅ All functions loaded!');
</script>
