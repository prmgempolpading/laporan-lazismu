<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Laporan Keuangan - Lazismu PRM Gempolpading</title>
    
    <!-- Font & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js & XLSX Export -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --primary: #f37021;
            --primary-dark: #d95d13;
            --secondary: #00a651;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
            --radius: 12px;
        }

        body.dark-mode {
            --bg-body: #0f172a;
            --bg-card: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; transition: background 0.2s, color 0.2s; }
        body { background: var(--bg-body); color: var(--text-main); display: flex; min-height: 100vh; }

        aside {
            width: 280px;
            background: var(--bg-card);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            position: fixed; height: 100vh; z-index: 100;
        }
        .brand {
            padding: 24px; display: flex; align-items: center; gap: 12px;
            border-bottom: 1px solid var(--border);
        }
        .brand-icon {
            width: 40px; height: 40px; background: var(--primary); color: white;
            border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px;
        }
        .brand-text h2 { font-size: 16px; font-weight: 700; color: var(--primary); }
        .brand-text p { font-size: 11px; color: var(--text-muted); }

        .sheet-menu { flex: 1; overflow-y: auto; padding: 16px; }
        .menu-title { font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 700; margin: 12px 0 8px 12px; }
        .sheet-btn {
            width: 100%; padding: 12px 16px; background: transparent; border: none;
            border-radius: 8px; color: var(--text-muted); font-weight: 500; font-size: 14px;
            text-align: left; cursor: pointer; display: flex; align-items: center; gap: 10px; margin-bottom: 4px;
        }
        .sheet-btn:hover { background: rgba(243, 112, 33, 0.08); color: var(--primary); }
        .sheet-btn.active { background: var(--primary); color: white; font-weight: 600; }

        main { flex: 1; margin-left: 280px; padding: 32px; max-width: calc(100% - 280px); }
        header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; flex-wrap: wrap; gap: 16px; }
        .header-title h1 { font-size: 22px; font-weight: 700; }
        .header-title p { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
        .actions { display: flex; gap: 10px; align-items: center; }

        .btn {
            padding: 10px 16px; border-radius: 8px; border: 1px solid var(--border);
            background: var(--bg-card); color: var(--text-main); font-size: 13px; font-weight: 500;
            cursor: pointer; display: inline-flex; align-items: center; gap: 8px; box-shadow: var(--shadow);
        }
        .btn:hover { border-color: var(--primary); color: var(--primary); }

        .controls-bar {
            background: var(--bg-card); padding: 16px; border-radius: var(--radius);
            border: 1px solid var(--border); display: flex; gap: 16px; margin-bottom: 24px; box-shadow: var(--shadow); flex-wrap: wrap;
        }
        .search-box { flex: 1; min-width: 200px; position: relative; }
        .search-box i { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--text-muted); }
        .search-box input {
            width: 100%; padding: 10px 14px 10px 40px; border-radius: 8px;
            border: 1px solid var(--border); background: var(--bg-body); color: var(--text-main); outline: none;
        }

        .cards-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 24px; }
        .card { background: var(--bg-card); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .card-header { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 13px; font-weight: 500; }
        .card-value { font-size: 22px; font-weight: 700; margin-top: 10px; }
        .card-sub { font-size: 11px; color: var(--secondary); margin-top: 6px; display: flex; align-items: center; gap: 4px; }

        .charts-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(350px, 1fr)); gap: 20px; margin-bottom: 24px; }
        .chart-container { background: var(--bg-card); padding: 20px; border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); }
        .chart-title { font-size: 15px; font-weight: 600; margin-bottom: 16px; display: flex; justify-content: space-between; }

        .table-card { background: var(--bg-card); border-radius: var(--radius); border: 1px solid var(--border); box-shadow: var(--shadow); overflow: hidden; }
        .table-wrapper { overflow-x: auto; max-height: 500px; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 13px; }
        th { background: var(--bg-body); padding: 14px 16px; color: var(--text-muted); font-weight: 600; border-bottom: 1px solid var(--border); position: sticky; top: 0; }
        td { padding: 14px 16px; border-bottom: 1px solid var(--border); }
        tr:hover { background: rgba(0,0,0,0.01); }

        @media (max-width: 900px) {
            aside { display: none; }
            main { margin-left: 0; max-width: 100%; padding: 16px; }
            .charts-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <aside>
        <div class="brand">
            <div class="brand-icon"><i class="fa-solid fa-hand-holding-heart"></i></div>
            <div class="brand-text">
                <h2>LAZISMU</h2>
                <p>PRM Gempolpading</p>
            </div>
        </div>
        <div class="menu-title">Semua Sheet Laporan</div>
        <div class="sheet-menu" id="sheetMenuList">
            <div style="padding: 12px; color: var(--text-muted); font-size: 13px;">Memuat daftar tab...</div>
        </div>
    </aside>

    <main>
        <header>
            <div class="header-title">
                <h1 id="currentSheetTitle">Pilih Sheet Laporan</h1>
                <p id="lastUpdateText">Menghubungkan ke Google Sheets API...</p>
            </div>
            <div class="actions">
                <button class="btn" onclick="loadData()"><i class="fa-solid fa-rotate"></i> Refresh</button>
                <button class="btn" onclick="exportToExcel()"><i class="fa-solid fa-file-excel"></i> Export Excel</button>
                <button class="btn" onclick="toggleDarkMode()"><i class="fa-solid fa-moon"></i></button>
            </div>
        </header>

        <div class="controls-bar">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" onkeyup="filterTable()" placeholder="Cari data pada sheet ini...">
            </div>
            <button class="btn" onclick="window.print()"><i class="fa-solid fa-print"></i> Cetak Laporan</button>
        </div>

        <div class="cards-grid">
            <div class="card">
                <div class="card-header"><span>Total Baris Transaksi</span> <i class="fa-solid fa-list-check"></i></div>
                <div class="card-value" id="cardTotalRows">0</div>
                <div class="card-sub"><i class="fa-solid fa-database"></i> Baris Data Terbaca</div>
            </div>
            <div class="card">
                <div class="card-header"><span>Total Sheet Terdeteksi</span> <i class="fa-solid fa-layer-group"></i></div>
                <div class="card-value" style="color: var(--primary);" id="cardTotalSheets">0 Sheet</div>
                <div class="card-sub"><i class="fa-solid fa-circle-check"></i> Auto-Sync Aktif</div>
            </div>
        </div>

        <div class="charts-grid">
            <div class="chart-container">
                <div class="chart-title"><span>Visualisasi Tren Data</span> <i class="fa-solid fa-chart-line"></i></div>
                <canvas id="lineChart" height="200"></canvas>
            </div>
            <div class="chart-container">
                <div class="chart-title"><span>Grafik Batang</span> <i class="fa-solid fa-chart-pie"></i></div>
                <canvas id="barChart" height="200"></canvas>
            </div>
        </div>

        <div class="table-card">
            <div class="table-wrapper">
                <table id="dataTable">
                    <thead><tr id="tableHead"><th>Memuat Data...</th></tr></thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        // URL Apps Script kamu sudah terpasang di sini
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycby3sD_atl6VpIp0jTigXputtlXqOLnZ4larJo4taSoRwC21E6sU1Dt8jItqUcep-C7tSw/exec";

        let rawData = {};
        let currentSheet = "";
        let chartInstance1 = null;
        let chartInstance2 = null;

        async function loadData() {
            document.getElementById('lastUpdateText').innerText = "Mengambil data seluruh sheet...";
            try {
                const res = await fetch(SCRIPT_URL);
                rawData = await res.json();
                
                const sheetNames = Object.keys(rawData);
                document.getElementById('cardTotalSheets').innerText = `${sheetNames.length} Sheet`;
                
                renderSidebarMenu(sheetNames);

                if (sheetNames.length > 0) {
                    if (!currentSheet || !rawData[currentSheet]) {
                        currentSheet = sheetNames[0];
                    }
                    displaySheetData(currentSheet);
                }
                
                const now = new Date().toLocaleTimeString('id-ID');
                document.getElementById('lastUpdateText').innerText = `Terakhir Sinkron: ${now}`;
            } catch (err) {
                console.error(err);
                document.getElementById('lastUpdateText').innerText = "Gagal memuat API Apps Script.";
            }
        }

        function renderSidebarMenu(sheetNames) {
            const menuContainer = document.getElementById('sheetMenuList');
            menuContainer.innerHTML = "";

            sheetNames.forEach(name => {
                const btn = document.createElement('button');
                btn.className = `sheet-btn ${name === currentSheet ? 'active' : ''}`;
                btn.innerHTML = `<i class="fa-solid fa-file-lines"></i> ${name}`;
                btn.onclick = () => displaySheetData(name);
                menuContainer.appendChild(btn);
            });
        }

        function displaySheetData(sheetName) {
            currentSheet = sheetName;
            document.getElementById('currentSheetTitle').innerText = sheetName;
            
            renderSidebarMenu(Object.keys(rawData));

            const rows = rawData[sheetName];
            if (!rows || rows.length === 0) return;

            const headers = rows[0];
            const dataRows = rows.slice(1);

            document.getElementById('tableHead').innerHTML = headers.map(h => `<th>${h}</th>`).join('');
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = "";
            document.getElementById('cardTotalRows').innerText = dataRows.length;

            dataRows.forEach(row => {
                const tr = document.createElement('tr');
                tr.innerHTML = row.map(cell => `<td>${cell !== undefined ? cell : ''}</td>`).join('');
                tbody.appendChild(tr);
            });

            renderCharts(headers, dataRows);
        }

        function renderCharts(headers, data) {
            const labels = data.map(r => r[0]); 
            const values = data.map(r => {
                let num = parseFloat(String(r[1]).replace(/[^0-9,-]/g, '').replace(',', '.'));
                return isNaN(num) ? 0 : num;
            });

            if (chartInstance1) chartInstance1.destroy();
            if (chartInstance2) chartInstance2.destroy();

            const ctx1 = document.getElementById('lineChart').getContext('2d');
            chartInstance1 = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: headers[1] || 'Nilai',
                        data: values,
                        borderColor: '#f37021',
                        backgroundColor: 'rgba(243, 112, 33, 0.1)',
                        fill: true, tension: 0.3
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });

            const ctx2 = document.getElementById('barChart').getContext('2d');
            chartInstance2 = new Chart(ctx2, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: headers[1] || 'Nilai',
                        data: values,
                        backgroundColor: '#00a651'
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false }
            });
        }

        function filterTable() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const rows = document.querySelectorAll('#tableBody tr');
            rows.forEach(row => {
                row.style.display = row.innerText.toLowerCase().includes(input) ? '' : 'none';
            });
        }

        function exportToExcel() {
            const table = document.getElementById("dataTable");
            const wb = XLSX.utils.table_to_book(table, {sheet: currentSheet});
            XLSX.writeFile(wb, `Laporan_${currentSheet}_Lazismu.xlsx`);
        }

        function toggleDarkMode() {
            document.body.classList.toggle('dark-mode');
        }

        window.onload = loadData;
    </script>
</body>
</html>
