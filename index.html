<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Lazizmu PRM Gempolpading</title>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        /* ===== CSS VARIABLES ===== */
        :root {
            --primary: #6C5CE7;
            --primary-dark: #5A4BD1;
            --secondary: #00CEC9;
            --success: #00B894;
            --danger: #FF6B6B;
            --warning: #FDCB6E;
            --info: #74B9FF;
            --dark: #2D3436;
            --light: #DFE6E9;
            --white: #FFFFFF;
            --shadow: 0 10px 30px rgba(0,0,0,0.1);
            --shadow-hover: 0 15px 40px rgba(0,0,0,0.2);
            --radius: 20px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ===== RESET & BASE ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #F8F9FA 0%, #E9ECEF 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        /* ===== WATERMARK / BACKGROUND ===== */
        .watermark {
            position: fixed;
            opacity: 0.05;
            pointer-events: none;
            z-index: 0;
            font-size: 200px;
            right: -50px;
            bottom: -50px;
            transform: rotate(-15deg);
            color: var(--primary);
        }

        /* ===== LOGO ===== */
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            padding: 15px 0;
        }

        .logo-img {
            width: 60px;
            height: 60px;
            object-fit: contain;
            border-radius: 12px;
        }

        /* ===== LAYOUT ===== */
        .app-container {
            max-width: 1440px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        /* ===== HEADER ===== */
        .header {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px);
            border-radius: var(--radius);
            padding: 25px 30px;
            margin-bottom: 30px;
            box-shadow: var(--shadow);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
            border: 1px solid rgba(255,255,255,0.3);
        }

        .header-title h1 {
            font-size: 28px;
            font-weight: 800;
            color: var(--dark);
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title p {
            color: #636E72;
            font-size: 14px;
            font-weight: 400;
        }

        .header-actions {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 24px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-family: 'Inter', sans-serif;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.4);
        }

        .btn-success {
            background: var(--success);
            color: white;
            box-shadow: 0 4px 15px rgba(0, 184, 148, 0.3);
        }

        .btn-success:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0, 184, 148, 0.4);
        }

        .btn-outline {
            background: transparent;
            border: 2px solid var(--primary);
            color: var(--primary);
        }

        .btn-outline:hover {
            background: var(--primary);
            color: white;
            transform: translateY(-2px);
        }

        /* ===== STATS CARDS ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid rgba(0,0,0,0.05);
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), var(--secondary));
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: var(--shadow-hover);
        }

        .stat-card .icon {
            font-size: 32px;
            margin-bottom: 12px;
            display: inline-block;
            background: rgba(108, 92, 231, 0.1);
            padding: 12px;
            border-radius: 12px;
            color: var(--primary);
        }

        .stat-card .label {
            font-size: 14px;
            color: #636E72;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-card .value {
            font-size: 32px;
            font-weight: 800;
            color: var(--dark);
            margin-top: 5px;
        }

        .stat-card .change {
            font-size: 13px;
            margin-top: 8px;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
            background: rgba(0, 184, 148, 0.1);
            color: var(--success);
        }

        /* Card color variants */
        .stat-card.income::before { background: linear-gradient(90deg, #00B894, #00CEC9); }
        .stat-card.expense::before { background: linear-gradient(90deg, #FF6B6B, #EE5A24); }
        .stat-card.donors::before { background: linear-gradient(90deg, #6C5CE7, #A29BFE); }
        .stat-card.pending::before { background: linear-gradient(90deg, #FDCB6E, #F39C12); }

        /* ===== MAIN CONTENT ===== */
        .content-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 25px;
            margin-bottom: 30px;
        }

        @media (max-width: 992px) {
            .content-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: white;
            border-radius: var(--radius);
            padding: 25px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid rgba(0,0,0,0.05);
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
        }

        .card-title {
            font-size: 18px;
            font-weight: 700;
            color: var(--dark);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-title i {
            color: var(--primary);
        }

        /* ===== CHART CONTAINER ===== */
        .chart-container {
            position: relative;
            height: 300px;
            width: 100%;
        }

        /* ===== DONOR LIST ===== */
        .donor-list {
            max-height: 300px;
            overflow-y: auto;
        }

        .donor-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            border-radius: 12px;
            transition: var(--transition);
            border-bottom: 1px solid #f0f0f0;
            cursor: pointer;
        }

        .donor-item:hover {
            background: rgba(108, 92, 231, 0.05);
            transform: translateX(5px);
        }

        .donor-item .name {
            font-weight: 600;
            color: var(--dark);
        }

        .donor-item .status {
            font-size: 12px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }

        .status-pending {
            background: #FFF3E0;
            color: #E65100;
        }

        .status-done {
            background: #E8F5E9;
            color: #2E7D32;
        }

        /* ===== SHEET NAVIGATION ===== */
        .sheet-tabs {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
            padding: 5px;
        }

        .sheet-tab {
            padding: 10px 24px;
            background: rgba(255,255,255,0.7);
            border: 2px solid transparent;
            border-radius: 12px;
            cursor: pointer;
            transition: var(--transition);
            font-weight: 600;
            font-size: 14px;
            color: #636E72;
            backdrop-filter: blur(10px);
        }

        .sheet-tab:hover {
            background: white;
            border-color: var(--primary);
            color: var(--primary);
            transform: translateY(-2px);
        }

        .sheet-tab.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
            box-shadow: 0 4px 15px rgba(108, 92, 231, 0.3);
        }

        /* ===== TABLE ===== */
        .table-responsive {
            overflow-x: auto;
            margin-top: 15px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th {
            background: #F8F9FA;
            padding: 12px 15px;
            text-align: left;
            font-weight: 600;
            color: var(--dark);
            border-bottom: 2px solid #E9ECEF;
        }

        td {
            padding: 12px 15px;
            border-bottom: 1px solid #F0F0F0;
            color: #2D3436;
        }

        tr:hover {
            background: rgba(108, 92, 231, 0.03);
        }

        /* ===== LOADING ===== */
        .loading {
            text-align: center;
            padding: 60px 20px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid #f0f0f0;
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            body {
                padding: 10px;
            }

            .header {
                padding: 20px;
                flex-direction: column;
                align-items: stretch;
            }

            .header-title h1 {
                font-size: 22px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 12px;
            }

            .stat-card {
                padding: 18px;
            }

            .stat-card .value {
                font-size: 24px;
            }

            .card {
                padding: 18px;
            }

            .sheet-tab {
                padding: 8px 16px;
                font-size: 12px;
            }

            .logo-img {
                width: 45px;
                height: 45px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }

            .stat-card .icon {
                font-size: 24px;
                padding: 8px;
            }

            .stat-card .value {
                font-size: 20px;
            }
        }

        /* ===== CUSTOM SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #F0F0F0;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--primary);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--primary-dark);
        }

        /* ===== ALERT / NOTIFICATION ===== */
        .alert {
            padding: 15px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            animation: slideIn 0.5s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-20px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .alert-info {
            background: #E3F2FD;
            color: #0D47A1;
            border-left: 4px solid #2196F3;
        }

        .alert-success {
            background: #E8F5E9;
            color: #1B5E20;
            border-left: 4px solid #4CAF50;
        }

        /* ===== RESPONSIVE TABLE WRAPPER ===== */
        .table-wrapper {
            max-height: 400px;
            overflow: auto;
        }
    </style>
</head>
<body>

<!-- ===== WATERMARK / BACKGROUND ===== -->
<div class="watermark">
    <i class="fas fa-mosque"></i>
</div>

<!-- ===== MAIN APP ===== -->
<div class="app-container" id="app">
    
    <!-- ===== HEADER ===== -->
    <header class="header">
        <div class="header-title">
            <div class="logo-container">
                <!-- 
                    LETAKKAN LOGO DI SINI:
                    Ganti logo.png dengan file logo Anda
                    Letakkan file di folder yang sama dengan index.html
                -->
                <img src="logo.png" alt="Logo" class="logo-img" id="logoImg" onerror="this.style.display='none'">
                <div>
                    <h1>📊 Dashboard Lazizmu</h1>
                    <p>PRM Gempolpading • Laporan Keuangan & Donatur</p>
                </div>
            </div>
        </div>
        <div class="header-actions">
            <button class="btn btn-success" onclick="refreshData()">
                <i class="fas fa-sync"></i> Refresh
            </button>
            <button class="btn btn-outline" onclick="exportReport()">
                <i class="fas fa-download"></i> Export
            </button>
            <span style="font-size:13px; color:#636E72;" id="lastUpdate">-</span>
        </div>
    </header>

    <!-- ===== STATS ===== -->
    <div class="stats-grid" id="statsGrid">
        <!-- Dinamis via JavaScript -->
    </div>

    <!-- ===== SHEET TABS ===== -->
    <div class="sheet-tabs" id="sheetTabs">
        <!-- Dinamis via JavaScript -->
    </div>

    <!-- ===== CONTENT ===== -->
    <div class="content-grid">
        <!-- Chart Section -->
        <div class="card">
            <div class="card-title">
                <i class="fas fa-chart-pie"></i> Ringkasan Keuangan
            </div>
            <div class="chart-container">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <!-- Donatur & Reminder -->
        <div class="card">
            <div class="card-title">
                <i class="fas fa-users"></i> Donatur & Reminder
                <span style="margin-left:auto; font-size:12px; color:#636E72;" id="donorCount">0</span>
            </div>
            <div class="donor-list" id="donorList">
                <!-- Dinamis via JavaScript -->
            </div>
        </div>
    </div>

    <!-- ===== TABLE DATA ===== -->
    <div class="card" style="margin-bottom:30px;">
        <div class="card-title">
            <i class="fas fa-table"></i> Data Detail
            <span style="margin-left:auto; font-size:12px; color:#636E72;" id="sheetNameDisplay">-</span>
        </div>
        <div class="table-wrapper">
            <div class="table-responsive" id="tableContainer">
                <!-- Dinamis via JavaScript -->
            </div>
        </div>
    </div>

    <!-- ===== LOADING ===== -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p style="color:#636E72;">Memuat data...</p>
    </div>
</div>

<!-- ======================================== -->
<!-- ===== JAVASCRIPT ===== -->
<!-- ======================================== -->
<script>
// ==================================================
// 1. KONFIGURASI
// ==================================================
const CONFIG = {
    // GANTI DENGAN URL WEB APP ANDA
    API_URL: 'https://script.google.com/macros/s/AKfycbxkCc1jnymsNJDnGxzQ2pCljGV2En7mfG_GVPIOPC0WXnyRBcqJAnG_g7P49ExRPuK8Og/exec',
    AUTO_REFRESH: 300000, // 5 menit
    MAX_DONORS: 50
};

// ==================================================
// 2. STATE
// ==================================================
let state = {
    data: null,
    currentSheet: '',
    chart: null,
    allSheets: [],
    loading: false
};

// ==================================================
// 3. INISIALISASI
// ==================================================
document.addEventListener('DOMContentLoaded', function() {
    loadData();
    
    // Auto refresh
    if (CONFIG.AUTO_REFRESH > 0) {
        setInterval(refreshData, CONFIG.AUTO_REFRESH);
    }
});

// ==================================================
// 4. LOAD DATA DARI SPREADSHEET
// ==================================================
async function loadData() {
    try {
        showLoading(true);
        
        const response = await fetch(CONFIG.API_URL);
        if (!response.ok) throw new Error('Gagal mengambil data');
        
        const data = await response.json();
        
        if (data.error) {
            throw new Error(data.message || data.error);
        }
        
        state.data = data;
        state.allSheets = data.allSheets || [];
        
        // Set current sheet
        if (state.allSheets.length > 0) {
            state.currentSheet = state.allSheets[0];
        }
        
        // Render semua
        renderDashboard();
        renderSheets();
        renderCurrentSheet();
        updateLastUpdate();
        
        showLoading(false);
        showNotification('Data berhasil dimuat!', 'success');
        
    } catch (error) {
        console.error('Error loading data:', error);
        showLoading(false);
        showNotification('Error: ' + error.message, 'error');
    }
}

// ==================================================
// 5. RENDER DASHBOARD STATS
// ==================================================
function renderDashboard() {
    if (!state.data) return;
    
    const overall = state.data.overallSummary || {};
    const stats = [
        {
            icon: 'fa-wallet',
            label: 'Total Pemasukan',
            value: formatRupiah(overall.totalIncome || 0),
            change: '+12.5%',
            class: 'income'
        },
        {
            icon: 'fa-credit-card',
            label: 'Total Pengeluaran',
            value: formatRupiah(overall.totalExpense || 0),
            change: '-8.3%',
            class: 'expense'
        },
        {
            icon: 'fa-user-plus',
            label: 'Total Donatur',
            value: (overall.totalDonors || 0).toString(),
            change: 'Aktif',
            class: 'donors'
        },
        {
            icon: 'fa-clock',
            label: 'Pending Donasi',
            value: (overall.pendingDonors || 0).toString(),
            change: 'Perlu diingatkan',
            class: 'pending'
        }
    ];
    
    const grid = document.getElementById('statsGrid');
    grid.innerHTML = stats.map(stat => `
        <div class="stat-card ${stat.class}">
            <div class="icon"><i class="fas ${stat.icon}"></i></div>
            <div class="label">${stat.label}</div>
            <div class="value">${stat.value}</div>
            <div class="change">${stat.change}</div>
        </div>
    `).join('');
}

// ==================================================
// 6. RENDER SHEET TABS
// ==================================================
function renderSheets() {
    const container = document.getElementById('sheetTabs');
    if (!state.allSheets.length) {
        container.innerHTML = '<span style="color:#636E72;">Tidak ada sheet</span>';
        return;
    }
    
    container.innerHTML = state.allSheets.map(sheet => `
        <button class="sheet-tab ${sheet === state.currentSheet ? 'active' : ''}"
                onclick="switchSheet('${sheet}')">
            <i class="fas fa-file"></i> ${sheet}
        </button>
    `).join('');
}

// ==================================================
// 7. SWITCH SHEET
// ==================================================
function switchSheet(sheetName) {
    state.currentSheet = sheetName;
    renderSheets();
    renderCurrentSheet();
}

// ==================================================
// 8. RENDER CURRENT SHEET DATA
// ==================================================
function renderCurrentSheet() {
    if (!state.data || !state.currentSheet) return;
    
    const sheetData = state.data.sheets[state.currentSheet];
    if (!sheetData) {
        document.getElementById('tableContainer').innerHTML = '<p>Data tidak tersedia</p>';
        return;
    }
    
    // Update sheet name display
    document.getElementById('sheetNameDisplay').textContent = `📄 ${state.currentSheet}`;
    
    // Render table
    renderTable(sheetData);
    
    // Update chart
    updateChart(sheetData);
    
    // Update donor list
    renderDonors(sheetData);
}

// ==================================================
// 9. RENDER TABLE
// ==================================================
function renderTable(sheetData) {
    const container = document.getElementById('tableContainer');
    const headers = sheetData.headers || [];
    const rows = sheetData.data || [];
    
    if (!headers.length || !rows.length) {
        container.innerHTML = '<p style="text-align:center; color:#636E72;">Tidak ada data</p>';
        return;
    }
    
    // Limit rows untuk performa
    const displayRows = rows.slice(0, 100);
    
    let html = '<table>';
    html += '<thead><tr>';
    headers.forEach(h => {
        html += `<th>${escapeHtml(h)}</th>`;
    });
    html += '</tr></thead><tbody>';
    
    displayRows.forEach(row => {
        html += '<tr>';
        headers.forEach(h => {
            const value = row[h] !== undefined ? row[h] : '-';
            html += `<td>${escapeHtml(String(value))}</td>`;
        });
        html += '</tr>';
    });
    
    html += '</tbody></table>';
    
    if (rows.length > 100) {
        html += `<p style="text-align:center; color:#636E72; margin-top:10px;">
            Menampilkan 100 dari ${rows.length} data
        </p>`;
    }
    
    container.innerHTML = html;
}

// ==================================================
// 10. RENDER DONORS
// ==================================================
function renderDonors(sheetData) {
    const container = document.getElementById('donorList');
    const rows = sheetData.data || [];
    const headers = sheetData.headers || [];
    
    // Cari kolom donor
    const donorCol = headers.find(h => 
        /donatur|donor|nama/i.test(h)
    );
    const statusCol = headers.find(h => 
        /status|keterangan|progres/i.test(h)
    );
    const amountCol = headers.find(h => 
        /jumlah|nominal|amount/i.test(h)
    );
    
    if (!donorCol) {
        container.innerHTML = '<p style="color:#636E72;">Kolom donatur tidak ditemukan</p>';
        return;
    }
    
    // Extract donors
    const donors = rows
        .map(row => ({
            name: row[donorCol] || 'Unknown',
            status: row[statusCol] || 'Pending',
            amount: parseFloat(row[amountCol]) || 0,
            data: row
        }))
        .filter(d => d.name && d.name.trim() !== '')
        .slice(0, CONFIG.MAX_DONORS);
    
    document.getElementById('donorCount').textContent = `(${donors.length} donatur)`;
    
    if (!donors.length) {
        container.innerHTML = '<p style="color:#636E72;">Belum ada data donatur</p>';
        return;
    }
    
    container.innerHTML = donors.map(d => {
        const isPending = /pending|belum/i.test(d.status);
        return `
            <div class="donor-item" onclick="showDonorDetail('${escapeHtml(d.name)}')">
                <div>
                    <div class="name">${escapeHtml(d.name)}</div>
                    <div style="font-size:12px; color:#636E72;">
                        ${formatRupiah(d.amount)}
                    </div>
                </div>
                <div>
                    <span class="status ${isPending ? 'status-pending' : 'status-done'}">
                        ${isPending ? '⏳ Pending' : '✅ Selesai'}
                    </span>
                </div>
            </div>
        `;
    }).join('');
    
    // Tambahkan reminder jika ada pending
    const pendingCount = donors.filter(d => /pending|belum/i.test(d.status)).length;
    if (pendingCount > 0) {
        container.innerHTML += `
            <div style="margin-top:15px; padding:12px; background:#FFF3E0; border-radius:12px; text-align:center; font-size:13px; color:#E65100;">
                <i class="fas fa-bell"></i> 
                ${pendingCount} donatur perlu diingatkan untuk berdonasi
                <button class="btn" style="margin-left:10px; padding:4px 16px; background:#E65100; color:white; font-size:12px;" onclick="sendReminder()">
                    Kirim Reminder
                </button>
            </div>
        `;
    }
}

// ==================================================
// 11. UPDATE CHART
// ==================================================
function updateChart(sheetData) {
    const ctx = document.getElementById('mainChart').getContext('2d');
    const summary = sheetData.summary || {};
    
    // Destroy existing chart
    if (state.chart) {
        state.chart.destroy();
    }
    
    // Prepare data
    const categories = summary.categories || {};
    const labels = Object.keys(categories);
    const values = Object.values(categories);
    
    // Jika tidak ada data kategori, gunakan summary
    if (!labels.length) {
        // Gunakan monthly data jika ada
        const monthly = summary.monthlyData || {};
        const months = Object.keys(monthly).sort();
        const incomes = months.map(m => monthly[m].income || 0);
        const expenses = months.map(m => monthly[m].expense || 0);
        
        if (months.length) {
            state.chart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: months,
                    datasets: [
                        {
                            label: 'Pemasukan',
                            data: incomes,
                            backgroundColor: 'rgba(0, 184, 148, 0.7)',
                            borderColor: '#00B894',
                            borderWidth: 2,
                            borderRadius: 6
                        },
                        {
                            label: 'Pengeluaran',
                            data: expenses,
                            backgroundColor: 'rgba(255, 107, 107, 0.7)',
                            borderColor: '#FF6B6B',
                            borderWidth: 2,
                            borderRadius: 6
                        }
                    ]
                },
                options: getChartOptions('Bulanan')
            });
            return;
        }
    }
    
    // Chart dengan kategori
    const colors = ['#6C5CE7', '#00CEC9', '#00B894', '#FDCB6E', '#FF6B6B', '#74B9FF', '#A29BFE'];
    
    state.chart = new Chart(ctx, {
        type: 'doughnut',
        data: {
            labels: labels.slice(0, 6),
            datasets: [{
                data: values.slice(0, 6),
                backgroundColor: colors.slice(0, Math.min(labels.length, 6)),
                borderWidth: 0,
                hoverOffset: 15
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                    labels: {
                        padding: 15,
                        usePointStyle: true,
                        pointStyle: 'circle'
                    }
                }
            },
            cutout: '65%'
        }
    });
}

// ==================================================
// 12. CHART OPTIONS
// ==================================================
function getChartOptions(title) {
    return {
        responsive: true,
        maintainAspectRatio: false,
        plugins: {
            legend: {
                position: 'top',
                labels: {
                    padding: 15,
                    usePointStyle: true
                }
            }
        },
        scales: {
            y: {
                beginAtZero: true,
                grid: {
                    color: 'rgba(0,0,0,0.05)'
                }
            },
            x: {
                grid: {
                    display: false
                }
            }
        }
    };
}

// ==================================================
// 13. UTILITY FUNCTIONS
// ==================================================
function formatRupiah(amount) {
    return new Intl.NumberFormat('id-ID', {
        style: 'currency',
        currency: 'IDR',
        minimumFractionDigits: 0,
        maximumFractionDigits: 0
    }).format(amount);
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function showLoading(show) {
    document.getElementById('loading').style.display = show ? 'block' : 'none';
}

function updateLastUpdate() {
    const now = new Date();
    document.getElementById('lastUpdate').textContent = 
        `Last update: ${now.toLocaleString('id-ID')}`;
}

function showNotification(message, type = 'info') {
    const alert = document.createElement('div');
    alert.className = `alert alert-${type}`;
    alert.innerHTML = `
        <i class="fas ${type === 'success' ? 'fa-check-circle' : 'fa-exclamation-circle'}"></i>
        ${message}
        <span style="margin-left:auto; cursor:pointer;" onclick="this.parentElement.remove()">×</span>
    `;
    document.querySelector('.app-container').prepend(alert);
    
    setTimeout(() => {
        if (alert.parentElement) alert.remove();
    }, 5000);
}

// ==================================================
// 14. ACTIONS
// ==================================================
function refreshData() {
    showNotification('Merefresh data...', 'info');
    loadData();
}

function exportReport() {
    if (!state.data) return;
    
    const sheetData = state.data.sheets[state.currentSheet];
    if (!sheetData) return;
    
    // Export sebagai CSV
    const headers = sheetData.headers || [];
    const rows = sheetData.data || [];
    
    let csv = headers.join(',') + '\n';
    rows.forEach(row => {
        csv += headers.map(h => {
            let val = row[h] || '';
            if (typeof val === 'string' && val.includes(',')) {
                val = '"' + val + '"';
            }
            return val;
        }).join(',') + '\n';
    });
    
    // Download
    const blob = new Blob([csv], { type: 'text/csv' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `${state.currentSheet}_${new Date().toISOString().slice(0,10)}.csv`;
    a.click();
    URL.revokeObjectURL(url);
}

function showDonorDetail(name) {
    showNotification(`Detail donatur: ${name}`, 'info');
    // Bisa dikembangkan lebih lanjut
}

function sendReminder() {
    showNotification('Reminder dikirim ke donatur! 📨', 'success');
}

window.onerror = function(msg, url, line, col, error) {
    console.error('Global error:', msg);
    showNotification('Terjadi error: ' + msg, 'error');
};
